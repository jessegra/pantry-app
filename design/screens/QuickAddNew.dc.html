<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add: create new item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#1D5BD6}a:hover{color:#1648AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; justify-content: flex-end; background: #7D8592; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; overflow: hidden">

<div role="dialog" aria-labelledby="qn-title" style="display: flex; flex-direction: column; gap: 18px; padding: 10px 16px 32px; border-radius: 16px 16px 0 0; background: #FFFFFF">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D5DBE3"></span>

<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="qn-title" style="margin: 0; font-size: 20px; font-weight: 600">New item</h2>
<span style="color: #5A6472; font-size: 14px">Just a name and a place. Unit, par and store can wait until they're needed.</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4A5462">Name</span>
<input type="text" value="Tortillas" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 2px solid #1D5BD6; background: #FFFFFF; font-size: 16px; outline: none">
</label>

<div role="radiogroup" aria-label="Location" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 600; color: #4A5462">Location</span>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{g.hasName}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">{{g.name}}</span>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{g.locs}}" as="l" hint-placeholder-count="3">
<button role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="QuickAdd.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #1D5BD6; color: #1D5BD6; font-weight: 600; text-decoration: none">Add another</a>
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #1D5BD6; color: #FFFFFF; font-weight: 600; text-decoration: none">Add &amp; done</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var GROUPS = [
  { name: '', locs: ['Refrigerator', 'Refrigerator Drawer', 'Deep Freeze', 'Kitchen Cabinet Left'] },
  { name: 'Pantry', locs: ['Shelf 1', 'Shelf 2', 'Floor bin'] }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loc: 'Refrigerator' }; }
  renderVals() {
    var self = this, cur = this.state.loc;
    return {
      groups: GROUPS.map(function (g) {
        return {
          name: g.name, hasName: !!g.name,
          locs: g.locs.map(function (l) {
            var on = cur === l;
            return {
              label: l, on: on, pick: function () { self.setState({ loc: l }); },
              style: 'height: 44px; padding: 0 14px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#1D5BD6' : '#D5DBE3') + '; background: ' + (on ? '#1D5BD6' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14181F') + ';'
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
