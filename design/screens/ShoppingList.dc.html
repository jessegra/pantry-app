<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#1D5BD6}a:hover{color:#1648AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; overflow: hidden">

<div style="flex: none; padding: 48px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E3E7ED">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Shopping list</h1>
<a href="Shopped.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 10px; background: #1D5BD6; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">I just shopped</a>
</div>
<div style="display: flex; gap: 8px">
<input type="text" aria-label="Add to list" placeholder="Add something to the list" style="flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DC; background: #FFFFFF; font-size: 16px">
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #1D5BD6; background: #FFFFFF; color: #1D5BD6; font-weight: 600; cursor: pointer">Add</button>
</div>
</div>

<div style="flex: 1; overflow-y: auto">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="4">
<section>
<div style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 16px; background: #F6F8FB; border-bottom: 1px solid #E3E7ED">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #4A5462">{{s.name}}</h2>
<span style="font-size: 13px; color: #5A6472; font-variant-numeric: tabular-nums">{{s.countText}}</span>
</div>
<sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
<div style="{{r.rowStyle}}">
<button role="checkbox" aria-checked="{{r.checked}}" aria-label="{{r.checkLabel}}" onClick="{{r.toggle}}" style="flex: none; width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="{{r.boxStyle}}">
<sc-if value="{{r.checked}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="{{r.nameStyle}}">{{r.name}}</span>
<sc-if value="{{r.auto}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #1648AD">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>
Auto · {{r.reason}}</span>
</sc-if>
</span>
<span style="{{r.qtyStyle}}">{{r.qty}}</span>
<sc-if value="{{r.canMove}}" hint-placeholder-val="{{false}}">
<button aria-label="{{r.moveLabel}}" title="{{r.moveLabel}}" onClick="{{r.move}}" style="flex: none; width: 44px; height: 44px; margin-right: -8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #1D5BD6; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>
</button>
</sc-if>
<sc-if value="{{r.noMove}}" hint-placeholder-val="{{true}}"><span style="flex: none; width: 36px"></span></sc-if>
</div>
</sc-for>
</section>
</sc-for>
<div style="padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 8px">
<button style="height: 44px; border-radius: 10px; border: 1px solid #C9D1DC; background: #FFFFFF; color: #14181F; font-weight: 600; cursor: pointer">Export list</button>
</div>
</div>

<nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 8px 24px; border-top: 1px solid #E3E7ED; background: #FFFFFF">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v5H4zM4 14h16v5H4zM8 7.5h3M8 16.5h3"></path></svg>
Inventory</a>
<a href="ShoppingList.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #1D5BD6; text-decoration: none; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"></path><circle cx="9" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg>
<span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #1D5BD6; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{remaining}}</span>
List</a>
<a href="QuickAdd.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v8M8 12h8"></path></svg>
Add</a>
<a href="SettingsLocations.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var STORES = ['Costco', 'Fred Meyer', "Trader Joe's"];
var START = [
  { id: 'chicken', name: 'Chicken thighs', qty: '3 lb', store: 'Costco', alt: 'Fred Meyer', auto: true, reason: 'low, back to 4 lb' },
  { id: 'lemons', name: 'Lemons', qty: '4', store: 'Fred Meyer', checked: true },
  { id: 'coffee', name: 'Coffee beans', qty: '2 bags', store: "Trader Joe's", alt: 'Fred Meyer', auto: true, reason: 'low, back to 2 bags' },
  { id: 'tortillas', name: 'Tortillas', qty: '1 pack', store: "Trader Joe's" },
  { id: 'soap', name: 'Dish soap', qty: '1', store: null }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var rows = {};
    START.forEach(function (r) { rows[r.id] = { store: r.store, alt: r.alt, checked: !!r.checked }; });
    this.state = { rows: rows };
  }
  patch(id, p) { var rows = Object.assign({}, this.state.rows); rows[id] = Object.assign({}, rows[id], p); this.setState({ rows: rows }); }
  renderVals() {
    var self = this, st = this.state.rows;
    var build = function (r) {
      var s = st[r.id], c = s.checked;
      return {
        sortKey: c ? 1 : 0,
        name: r.name, qty: r.qty, auto: !!r.auto, reason: r.reason, checked: c,
        checkLabel: (c ? 'Uncheck ' : 'Check off ') + r.name,
        toggle: function () { self.patch(r.id, { checked: !c }); },
        canMove: !!s.alt && !c, noMove: !s.alt || c,
        moveLabel: s.alt ? 'Move to ' + s.alt : '',
        move: function () { self.patch(r.id, { store: s.alt, alt: s.store }); },
        rowStyle: 'display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid #EEF1F5; background: ' + (r.auto && !c ? '#F7F9FE' : '#FFFFFF') + ';',
        boxStyle: 'width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (c ? '#8A94A3' : '#4A5462') + '; background: ' + (c ? '#8A94A3' : '#FFFFFF') + ';',
        nameStyle: 'font-weight: 500; ' + (c ? 'color: #8A94A3; text-decoration: line-through;' : 'color: #14181F;'),
        qtyStyle: 'flex: none; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: ' + (c ? '#8A94A3' : '#14181F') + ';'
      };
    };
    var groups = STORES.concat([null]).map(function (store) {
      var rows = START.filter(function (r) { return st[r.id].store === store; }).map(build);
      rows.sort(function (a, b) { return a.sortKey - b.sortKey; });
      var open = rows.filter(function (r) { return !r.checked; }).length;
      return { name: store || 'Unassigned', rows: rows, countText: open + ' to get' };
    }).filter(function (g) { return g.rows.length > 0; });
    var remaining = START.filter(function (r) { return !st[r.id].checked; }).length;
    return { stores: groups, remaining: remaining };
  }
}
</script>
</body>
</html>
