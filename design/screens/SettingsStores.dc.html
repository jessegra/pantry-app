<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: stores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#1D5BD6}a:hover{color:#1648AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; overflow: hidden">

<div style="flex: none; padding: 48px 16px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7ED">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Settings</h1>
<nav aria-label="Settings sections" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #F1F4F8">
<a href="SettingsLocations.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 9px; color: #4A5462; font-weight: 500; text-decoration: none">Locations</a>
<a href="SettingsStores.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 9px; background: #FFFFFF; color: #1D5BD6; font-weight: 600; text-decoration: none; box-shadow: 0 1px 2px rgba(20,24,31,0.12)">Stores</a>
</nav>
</div>

<div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 4px; border-bottom: 1px solid #EEF1F5">
<button aria-label="{{s.reorderLabel}}" style="width: 40px; height: 44px; border: 0; background: transparent; cursor: grab; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#8A94A3"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
<a href="#" style="flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 44px; color: #14181F; text-decoration: none"><span style="font-weight: 500">{{s.name}}</span><span style="color: #5A6472; font-size: 13px">{{s.meta}}</span></a>
<button aria-label="{{s.deleteLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg></button>
</div>
</sc-for>
</div>

<div style="padding: 16px">
<button style="width: 100%; height: 48px; border-radius: 10px; border: 0; background: #1D5BD6; color: #FFFFFF; font-weight: 600; cursor: pointer">Add store</button>
</div>
<span style="padding: 0 16px 24px; color: #5A6472; font-size: 13px; line-height: 1.4">The order here is the order of store groups on your shopping list. Deleting a store sends its items to Unassigned.</span>
</div>

<nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 8px 24px; border-top: 1px solid #E3E7ED; background: #FFFFFF">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v5H4zM4 14h16v5H4zM8 7.5h3M8 16.5h3"></path></svg>
Inventory</a>
<a href="ShoppingList.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"></path><circle cx="9" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg>
List</a>
<a href="QuickAdd.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v8M8 12h8"></path></svg>
Add</a>
<a href="SettingsLocations.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #1D5BD6; text-decoration: none; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var STORES = [
  { name: 'Costco', preferred: 2, secondary: 0 },
  { name: 'Fred Meyer', preferred: 1, secondary: 2 },
  { name: "Trader Joe's", preferred: 2, secondary: 1 }
];
class Component extends DCLogic {
  renderVals() {
    return {
      stores: STORES.map(function (s) {
        return {
          name: s.name,
          meta: 'Preferred for ' + s.preferred + (s.preferred === 1 ? ' item' : ' items') + (s.secondary ? ' · backup for ' + s.secondary : ''),
          reorderLabel: 'Reorder ' + s.name, deleteLabel: 'Delete ' + s.name
        };
      })
    };
  }
}
</script>
</body>
</html>
