<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#1D5BD6}a:hover{color:#1648AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; overflow: hidden">

<div style="flex: none; padding: 48px 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E3E7ED">
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Quick add</h1>
<div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; border: 2px solid #1D5BD6">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<input type="search" aria-label="Find or create an item" placeholder="Find or create an item" value="{{query}}" onInput="{{onQuery}}" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px">
<sc-if value="{{hasQuery}}" hint-placeholder-val="{{true}}">
<button aria-label="Clear search" onClick="{{clear}}" style="width: 44px; height: 44px; margin-right: -12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6472" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
</sc-if>
</div>
</div>

<div style="flex: 1; overflow-y: auto; display: flex; flex-direction: column">

<sc-if value="{{hasQuery}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; border-bottom: 8px solid #F6F8FB">
<sc-for list="{{matches}}" as="m" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px 0 16px; border-bottom: 1px solid #EEF1F5">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">{{m.name}}</span><span style="color: #5A6472; font-size: 13px">{{m.where}}</span></span>
<span style="font-variant-numeric: tabular-nums; font-size: 14px; color: #4A5462">{{m.amount}}</span>
<button aria-label="{{m.addLabel}}" onClick="{{m.add}}" style="width: 48px; height: 44px; border-radius: 10px; border: 1px solid #1D5BD6; background: #FFFFFF; color: #1D5BD6; font-weight: 600; cursor: pointer">+1</button>
</div>
</sc-for>
<a href="QuickAddNew.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; color: #1D5BD6; text-decoration: none; font-weight: 600">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #EAF0FC; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D5BD6" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></span>
{{createLabel}}</a>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5462">Recent &amp; frequent</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{recent}}" as="r" hint-placeholder-count="9">
<button onClick="{{r.add}}" aria-label="{{r.addLabel}}" style="{{r.style}}">
<span style="font-weight: 500; font-size: 14px; line-height: 1.2; text-align: left">{{r.name}}</span>
<span style="font-size: 12px; font-weight: 600; color: #1D5BD6">{{r.badge}}</span>
</button>
</sc-for>
</div>
<span style="color: #5A6472; font-size: 13px">Each tap adds one {{unitHint}} to what's on hand.</span>
</div>

</div>

<nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 4px 8px 24px; border-top: 1px solid #E3E7ED; background: #FFFFFF">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v5H4zM4 14h16v5H4zM8 7.5h3M8 16.5h3"></path></svg>
Inventory</a>
<a href="ShoppingList.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"></path><circle cx="9" cy="19.5" r="1.3"></circle><circle cx="17" cy="19.5" r="1.3"></circle></svg>
List</a>
<a href="QuickAdd.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #1D5BD6; text-decoration: none; font-size: 12px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 8v8M8 12h8"></path></svg>
Add</a>
<a href="SettingsLocations.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; color: #4A5462; text-decoration: none; font-size: 12px; font-weight: 500">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>
Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ITEMS = [
  { id: 'milk', name: 'Milk', where: 'Refrigerator', amt: 1, unit: 'gal', plural: 'gal' },
  { id: 'eggs', name: 'Eggs', where: 'Refrigerator', amt: 9, unit: 'each', plural: 'each' },
  { id: 'bb', name: 'Black beans', where: 'Pantry · Shelf 1', amt: 3, unit: 'can', plural: 'cans' },
  { id: 'butter', name: 'Butter', where: 'Refrigerator Drawer', amt: 2, unit: 'stick', plural: 'sticks' },
  { id: 'peas', name: 'Frozen peas', where: 'Deep Freeze', amt: 2, unit: 'bag', plural: 'bags' },
  { id: 'coffee', name: 'Coffee beans', where: 'Pantry · Shelf 2', amt: 0.5, unit: 'bag', plural: 'bags', label: '½ bag' },
  { id: 'chicken', name: 'Chicken thighs', where: 'Deep Freeze', amt: 1, unit: 'lb', plural: 'lb' },
  { id: 'oil', name: 'Olive oil', where: 'Kitchen Cabinet Left', amt: 0.7, unit: 'bottle', plural: 'bottles', label: '70%' },
  { id: 'flour', name: 'Flour', where: 'Kitchen Cabinet Left', amt: 0.4, unit: 'bag', plural: 'bags', label: '40%' },
  { id: 'rice', name: 'Rice', where: 'Pantry · Shelf 1', amt: null }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { query: 'pe', added: {} }; }
  bump(id) { var a = Object.assign({}, this.state.added); a[id] = (a[id] || 0) + 1; this.setState({ added: a }); }
  renderVals() {
    var self = this, st = this.state, q = (st.query || '').trim().toLowerCase();
    var amountOf = function (it) {
      var extra = st.added[it.id] || 0;
      if (it.amt == null) return 'not set up';
      if (!extra && it.label) return it.label;
      var a = it.amt + extra;
      return (Math.round(a * 10) / 10) + ' ' + (a === 1 ? it.unit : it.plural);
    };
    var matches = q ? ITEMS.filter(function (it) { return it.name.toLowerCase().indexOf(q) !== -1; }) : [];
    var title = q ? st.query.trim().charAt(0).toUpperCase() + st.query.trim().slice(1) : '';
    return {
      query: st.query, hasQuery: !!q,
      onQuery: function (e) { self.setState({ query: e.target.value }); },
      clear: function () { self.setState({ query: '' }); },
      createLabel: 'Create “' + title + '”',
      unitHint: 'unit',
      matches: matches.map(function (it) {
        return { name: it.name, where: it.where, amount: amountOf(it), addLabel: 'Add one to ' + it.name, add: function () { self.bump(it.id); } };
      }),
      recent: ITEMS.slice(0, 9).map(function (it) {
        var n = st.added[it.id] || 0;
        return {
          name: it.name, badge: n ? '+' + n + ' added' : amountOf(it), addLabel: 'Add one to ' + it.name,
          add: function () { self.bump(it.id); },
          style: 'display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px; min-height: 64px; padding: 10px; border-radius: 10px; cursor: pointer; border: 1px solid ' + (n ? '#1D5BD6' : '#E3E7ED') + '; background: ' + (n ? '#EAF0FC' : '#FFFFFF') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
