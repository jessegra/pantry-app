<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open one: create a leftover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#1D5BD6}a:hover{color:#1648AD}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; background: #7D8592; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif; font-size: 15px; overflow: hidden">

<div role="dialog" aria-labelledby="oo-title" style="display: flex; flex-direction: column; gap: 18px; padding: 10px 16px 32px; border-radius: 16px 16px 0 0; background: #FFFFFF">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D5DBE3"></span>

<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="oo-title" style="margin: 0; font-size: 20px; font-weight: 600">Open one</h2>
<span style="color: #5A6472; font-size: 14px">Creates a leftover linked to Black beans. Leftovers never go on the list by themselves.</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4A5462">Name</span>
<input type="text" value="Black beans, opened" style="height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #C9D1DC; background: #FFFFFF; font-size: 16px">
</label>

<div role="group" aria-label="Unit" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4A5462">Unit</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{units}}" as="u" hint-placeholder-count="5">
<button aria-pressed="{{u.on}}" onClick="{{u.pick}}" style="{{u.style}}">{{u.label}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="Location" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: #4A5462">Location</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{locs}}" as="l" hint-placeholder-count="5">
<button aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
</sc-for>
</div>
</div>

<button role="checkbox" aria-checked="{{subtract}}" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 10px; border: 1px solid #E3E7ED; background: #F6F8FB; text-align: left; cursor: pointer">
<span style="{{boxStyle}}">
<sc-if value="{{subtract}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">Take 1 can from Black beans</span><span style="color: #5A6472; font-size: 13px">{{subtractNote}}</span></span>
</button>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="DetailFull.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; border: 1px solid #C9D1DC; color: #14181F; font-weight: 600; text-decoration: none">Cancel</a>
<a href="DetailFull.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: #1D5BD6; color: #FFFFFF; font-weight: 600; text-decoration: none">Create leftover</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var UNITS = ['can', 'oz', 'lb', 'bag', 'each'];
var LOCS = ['Refrigerator', 'Refrigerator Drawer', 'Deep Freeze', 'Shelf 1', 'Shelf 2', 'Kitchen Cabinet Left'];
function chip(on) {
  return 'height: 44px; padding: 0 14px; border-radius: 22px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#1D5BD6' : '#D5DBE3') + '; background: ' + (on ? '#1D5BD6' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14181F') + ';';
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { unit: 'oz', loc: 'Refrigerator', subtract: true }; }
  renderVals() {
    var self = this, st = this.state;
    return {
      units: UNITS.map(function (u) { return { label: u, on: st.unit === u, style: chip(st.unit === u), pick: function () { self.setState({ unit: u }); } }; }),
      locs: LOCS.map(function (l) { return { label: l, on: st.loc === l, style: chip(st.loc === l), pick: function () { self.setState({ loc: l }); } }; }),
      subtract: st.subtract,
      subtractNote: st.subtract ? 'Black beans goes from 3 to 2 cans' : 'For a leftover that didn’t come from tracked stock',
      toggle: function () { self.setState({ subtract: !st.subtract }); },
      boxStyle: 'flex: none; width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (st.subtract ? '#1D5BD6' : '#8A94A3') + '; background: ' + (st.subtract ? '#1D5BD6' : '#FFFFFF') + ';'
    };
  }
}
</script>
</body>
</html>
