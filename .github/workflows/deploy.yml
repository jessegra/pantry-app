# Test, build and publish on every push to main:
#   - pantry.jessegravenor.com (Network Solutions, over SFTP), the real home,
#     with the sync API (server/api) once its database secrets exist
#   - jessegra.github.io/pantry-app (GitHub Pages), kept until data has moved over
# Nothing is published unless lint, unit tests, the Playwright suite and the
# server contract tests (PHP 8.4 + MySQL 5.7) pass.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Offline core loop, install criteria, accessibility audit, against the Pages build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Deep links (e.g. /list) on a first visit, before the service worker is installed.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # The same app built for the root of its own subdomain.
      - run: npm run build -- --outDir dist-root
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: dist-root
          include-hidden-files: true # .htaccess
          retention-days: 7

  # The sync API against real PHP 8.4 + MySQL 5.7 (what the host runs): syntax
  # check, then the same contract tests the in-memory fake passes.
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pantry_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      PANTRY_API_URL: http://127.0.0.1:8080/api
      PANTRY_API_PASSWORD: ci-household-password
      PANTRY_API_CONFIG: ${{ github.workspace }}/ci-config.php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: PHP syntax
        run: find server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test config
        run: php scripts/write-api-config.php "$PANTRY_API_CONFIG"
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: pantry_test
          DB_USER: root
          DB_PASSWORD: root
          HOUSEHOLD_PASSWORD: ci-household-password
      - name: Start PHP
        run: |
          php -S 127.0.0.1:8080 server/api/index.php > php.log 2>&1 &
          for i in $(seq 1 30); do curl -sf "$PANTRY_API_URL/health" && break; sleep 1; done
          echo; curl -sS "$PANTRY_API_URL/health"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contract tests against PHP + MySQL
        run: npx vitest run src/data/sync/contract.test.ts
      - if: failure()
        run: cat php.log

  deploy:
    needs: [build, server]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-own-host:
    needs: [build, server]
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ftp.jessegravenor.com
      SFTP_PORT: '2222'
      # Pinned so the upload only ever goes to this server (checked 2026-10-16).
      SFTP_HOST_KEY: '[ftp.jessegravenor.com]:2222 ssh-rsa '
      # The subdomain's folder is public_html/pantry. Where that sits depends on the
      # SFTP account (this one is confined to the folder itself, i.e. "."), so each
      # candidate is proven by uploading a probe file and fetching it from SITE_URL.
      REMOTE_DIRS: . public_html/pantry pantry
      SITE_URL: https://pantry.jessegravenor.com
      SFTP_USER: ${{ secrets.PANTRY_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.PANTRY_SFTP_PASSWORD }}
      DB_HOST: ${{ secrets.PANTRY_DB_HOST }}
      DB_NAME: ${{ secrets.PANTRY_DB_NAME }}
      DB_USER: ${{ secrets.PANTRY_DB_USER }}
      DB_PASSWORD: ${{ secrets.PANTRY_DB_PASSWORD }}
      HOUSEHOLD_PASSWORD: ${{ secrets.PANTRY_HOUSEHOLD_PASSWORD }}
    steps:
      - name: Check which secrets are set
        id: ready
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::notice::PANTRY_SFTP_USER / PANTRY_SFTP_PASSWORD not set; skipping upload to $SITE_URL"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          # The sync API only goes up once the database and household password exist.
          if [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ] && [ -n "$HOUSEHOLD_PASSWORD" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Database / household password secrets not all set; deploying the app without the sync API"
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-root
          path: site
      - if: steps.ready.outputs.go == 'true'
        name: Upload over SFTP
        env:
          WITH_API: ${{ steps.ready.outputs.api }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh && echo "$SFTP_HOST_KEY" > ~/.ssh/known_hosts
          # This host only offers the legacy ssh-rsa host key, which OpenSSH no longer
          # accepts by default; allow it for this connection only (the key is pinned above).
          # cmd:fail-exit stops at the first error, so a failed cd can't upload elsewhere.
          CONNECT="set cmd:fail-exit yes;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa';
            set net:max-retries 2; set net:timeout 30;
            open -u $SFTP_USER --env-password -p $SFTP_PORT sftp://$SFTP_HOST"

          # Prove which folder is served at SITE_URL before uploading anything real.
          PROBE="deploy-probe-$GITHUB_RUN_ID.txt"
          echo "$GITHUB_SHA" > "$PROBE"
          REMOTE_DIR=''
          for d in $REMOTE_DIRS; do
            lftp -c "$CONNECT; cd $d; put $PROBE -o $PROBE" || continue
            served=$(curl -sS --max-time 20 "$SITE_URL/$PROBE" || true)
            lftp -c "$CONNECT; cd $d; rm $PROBE" || true
            if [ "$served" = "$GITHUB_SHA" ]; then REMOTE_DIR=$d; break; fi
            echo "$d is not the folder served at $SITE_URL"
          done
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::None of [$REMOTE_DIRS] is served at $SITE_URL. Where this SFTP account starts, and what's there:"
            lftp -c "$CONNECT; pwd; ls" 2>&1 || true
            exit 1
          fi
          echo "Uploading to $REMOTE_DIR"

          if [ "$WITH_API" = true ]; then
            cp -r server/api site/api
            rm -f site/api/config.example.php
            # Keep the stored password hash when the household password hasn't changed;
            # a fresh hash every deploy would sign every device out every time.
            lftp -c "$CONNECT; cd $REMOTE_DIR; get api/config.php -o old-config.php" 2>/dev/null || true
            php scripts/write-api-config.php site/api/config.php old-config.php
            rm -f old-config.php
          fi

          # Assets first, then the files that point at them (page, service worker,
          # manifest), so a visitor never gets a page whose files aren't there yet.
          # Old hashed assets are left in place for anyone mid-session on the last build.
          LATE='index.html sw.js registerSW.js manifest.webmanifest'
          lftp -c "
            $CONNECT;
            cd $REMOTE_DIR;
            mirror -R --verbose=1 --no-perms $(for f in $LATE; do printf -- '--exclude-glob %s ' "$f"; done) site .;
            put site/.htaccess -o .htaccess;
            $(for f in $LATE; do printf 'put site/%s -o %s; ' "$f" "$f"; done)
          "
          rm -f site/api/config.php
      - if: steps.ready.outputs.go == 'true'
        name: Check the live site
        env:
          WITH_API: ${{ steps.ready.outputs.api }}
        run: |
          fail=0
          check() { code=$(curl -sS -o /tmp/body -w '%{http_code}' "$SITE_URL$1"); echo "$1 -> $code"; [ "$code" = "${2:-200}" ] || fail=1; }
          check /            && grep -q '<title>Pantry</title>' /tmp/body || fail=1
          check /list        && grep -q '<title>Pantry</title>' /tmp/body || fail=1  # deep link via .htaccess
          check /sw.js
          check /manifest.webmanifest
          if [ "$WITH_API" = true ]; then
            check /api/health && grep -q '"db":true' /tmp/body || { echo "API health:"; cat /tmp/body; fail=1; }
            check /api/config.php 403   # never served
            check /api/lib/db.php 403   # never served
          fi
          exit $fail
