# Test, build and publish on every push to main:
#   - pantry.jessegravenor.com (Network Solutions, over SFTP), the real home
#   - jessegra.github.io/pantry-app (GitHub Pages), kept until data has moved over
# Nothing is published unless lint, unit tests and the Playwright suite pass.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Offline core loop, install criteria, accessibility audit, against the Pages build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      # Deep links (e.g. /list) on a first visit, before the service worker is installed.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # The same app built for the root of its own subdomain.
      - run: npm run build -- --outDir dist-root
        env:
          BASE_PATH: /
      - uses: actions/upload-artifact@v4
        with:
          name: site-root
          path: dist-root
          include-hidden-files: true # .htaccess
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-own-host:
    needs: build
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ftp.jessegravenor.com
      SFTP_PORT: '2222'
      # Pinned so the upload only ever goes to this server (checked 2026-10-16).
      SFTP_HOST_KEY: '[ftp.jessegravenor.com]:2222 ssh-rsa '
      # The subdomain's folder is public_html/pantry; where that sits depends on the
      # directory the SFTP account starts in, so the first of these that exists is used.
      REMOTE_DIRS: public_html/pantry pantry htdocs/pantry www/pantry
      SITE_URL: https://pantry.jessegravenor.com
      SFTP_USER: ${{ secrets.PANTRY_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.PANTRY_SFTP_PASSWORD }}
    steps:
      - name: Skip until the SFTP secrets are set
        id: ready
        run: |
          if [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "::notice::PANTRY_SFTP_USER / PANTRY_SFTP_PASSWORD not set; skipping upload to $SITE_URL"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-root
          path: site
      - if: steps.ready.outputs.go == 'true'
        name: Upload over SFTP
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh && echo "$SFTP_HOST_KEY" > ~/.ssh/known_hosts
          # Assets first, then the files that point at them (page, service worker,
          # manifest), so a visitor never gets a page whose files aren't there yet.
          # Old hashed assets are left in place for anyone mid-session on the last build.
          LATE='index.html sw.js registerSW.js manifest.webmanifest'
          # This host only offers the legacy ssh-rsa host key, which OpenSSH no longer
          # accepts by default; allow it for this connection only (the key is pinned above).
          # cmd:fail-exit stops at the first error, so a failed cd can't upload elsewhere.
          CONNECT="set cmd:fail-exit yes;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa';
            set net:max-retries 2; set net:timeout 30;
            open -u $SFTP_USER --env-password -p $SFTP_PORT sftp://$SFTP_HOST"
          REMOTE_DIR=''
          for d in $REMOTE_DIRS; do
            if lftp -c "$CONNECT; cd $d"; then REMOTE_DIR=$d; break; fi
          done
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::None of [$REMOTE_DIRS] exists for this SFTP account. Where it starts, and what's there:"
            lftp -c "$CONNECT; pwd; ls -la" 2>&1 || true
            exit 1
          fi
          echo "Uploading to $REMOTE_DIR"
          lftp -c "
            $CONNECT;
            cd $REMOTE_DIR;
            mirror -R --verbose=1 --no-perms $(for f in $LATE; do printf -- '--exclude-glob %s ' "$f"; done) site .;
            put site/.htaccess -o .htaccess;
            $(for f in $LATE; do printf 'put site/%s -o %s; ' "$f" "$f"; done)
          "
      - if: steps.ready.outputs.go == 'true'
        name: Check the live site
        run: |
          fail=0
          check() { code=$(curl -sS -o /tmp/body -w '%{http_code}' "$SITE_URL$1"); echo "$1 -> $code"; [ "$code" = 200 ] || fail=1; }
          check /            && grep -q '<title>Pantry</title>' /tmp/body || fail=1
          check /list        && grep -q '<title>Pantry</title>' /tmp/body || fail=1  # deep link via .htaccess
          check /sw.js
          check /manifest.webmanifest
          exit $fail
